name: FunMarket fileInformation PreProcessing

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
    paths:
      - 'dailyPerformance/**'
      - 'weeklyPerformance/**'
      - 'monthlyPerformance/**'
      - 'yearlyPerformance/**'

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # safety net: a hung step can never run for 56 minutes again
    env:
      TZ: Asia/Kolkata

    steps:

############################################
# STEP 1 — Checkout
############################################
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

############################################
# STEP 2 — Merge commit check
############################################
    - name: Check merge commit
      id: mergecheck
      run: |
        parents=$(git rev-list --parents -n 1 HEAD | wc -w)
        if [ "$parents" -lt 3 ]; then
          echo "continue=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "continue=true" >> $GITHUB_OUTPUT

############################################
# STEP 3 — Detect changed files
############################################
    - name: Detect changed files
      if: steps.mergecheck.outputs.continue == 'true'
      run: |
        git diff --name-status ${{ github.event.before }} ${{ github.sha }} > files.txt

############################################
# STEP 4 — Filter folders
############################################
    - name: Filter folders
      id: filter
      if: steps.mergecheck.outputs.continue == 'true'
      run: |
        python3 << 'EOF'
        import json, os
        allowed = [
          "dailyPerformance/",
          "weeklyPerformance/",
          "monthlyPerformance/",
          "yearlyPerformance/"
        ]
        files = []
        status = {}
        with open("files.txt") as f:
            for line in f:
                parts = line.rstrip("\n").split("\t")
                if len(parts) < 2:
                    continue
                st = parts[0][0]      # A, M, D, R, C ...
                path = parts[-1]      # for renames, take the new path
                if any(path.startswith(a) for a in allowed):
                    files.append(path)
                    status[path] = st
        if len(files) == 0:
            with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                out.write("continue=false\n")
            raise SystemExit(0)
        with open("filtered.json", "w") as f:
            json.dump({"files": files, "status": status}, f)
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write("continue=true\n")
        EOF

############################################
# STEP 5 — Wake services
############################################
    - name: Wake & Wait Services
      if: steps.filter.outputs.continue == 'true'
      run: |

        check_service() {
          NAME=$1
          URL=$2

          # 6 tries x (5s timeout + 5s sleep) = about 1 minute per service
          for i in {1..6}
          do
            # --max-time stops a hanging server from blocking the step.
            # The HTTP code is printed so the log shows what the server returns.
            CODE=$(curl -s -o body.txt -w "%{http_code}" --max-time 5 "$URL" || true)
            if [ "$CODE" = "200" ] && grep -q "UP" body.txt; then
              echo "$NAME UP ✅"
              return 0
            fi
            echo "$NAME retry $i (HTTP $CODE)"
            sleep 2
          done

          echo "$NAME failed ❌"
          exit 1
        }

        # /actuator/health is open on both services, so no login is sent.
        # (Wrong Basic-auth credentials would cause a 401 even on open paths.)
        check_service "Config" "https://funmarket-configserver.onrender.com/actuator/health"
        check_service "DB" "https://funmarket-file-agent.duckdns.org/actuator/health"

############################################
# STEP 6 — Get PR number
############################################
    - name: Get PR number
      if: steps.filter.outputs.continue == 'true'
      run: |
        curl -s --max-time 30 \
        -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
        https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
        > pr_list.json
        PR_NUMBER=$(jq -r '.[0].number // empty' pr_list.json 2>/dev/null || true)
        if [ -z "$PR_NUMBER" ]; then
          echo "No PR found"
          exit 0
        fi
        echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

############################################
# STEP 7 — Fetch PR info
############################################
    - name: Fetch PR info
      if: steps.filter.outputs.continue == 'true'
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo '{}' > pr.json
          exit 0
        fi
        curl -s --max-time 30 \
        -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
        https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER \
        > pr.json

############################################
# STEP 8 — Extract MR fields + reviewers
############################################
    - name: Extract MR fields
      if: steps.filter.outputs.continue == 'true'
      run: |

        CREATED=$(jq -r '.created_at // ""' pr.json)
        MERGED=$(jq -r '.merged_at // ""' pr.json)
        PUBLISHER=$(jq -r '.user.login // ""' pr.json)
        ASSIGNEES=$(jq -r '[.assignees[]?.login] | join(", ")' pr.json)

        if [ -n "$PR_NUMBER" ]; then
          REVIEWS=$(curl -s --max-time 30 \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews)
        else
          REVIEWS='[]'
        fi

        echo "====== REVIEWS RESPONSE ======"
        echo "$REVIEWS"
        echo "=============================="

        # Check if valid array
        if echo "$REVIEWS" | jq -e 'type=="array"' > /dev/null 2>&1; then

          APPROVED=$(echo "$REVIEWS" | jq -r '[.[]? | select(.state=="APPROVED")][0].submitted_at // ""')
          APPROVER=$(echo "$REVIEWS" | jq -r '[.[]? | select(.state=="APPROVED")][0].user.login // ""')
          REVIEWERS=$(echo "$REVIEWS" | jq -r '[.[]?.user.login] | unique | join(", ")')

          if [ -z "$REVIEWERS" ]; then
            REVIEWERS="No Reviews"
          fi

        else
          echo "Reviews API failed → setting default values"
          APPROVED=""
          APPROVER=""
          REVIEWERS="No Reviews"
        fi

        # Empty input must stay empty (date -d "" returns today's midnight)
        to_ist() {
          if [ -n "$1" ]; then
            date -d "$1" +"%Y-%m-%dT%H:%M:%S" 2>/dev/null || echo ""
          else
            echo ""
          fi
        }

        CREATED_IST=$(to_ist "$CREATED")
        APPROVED_IST=$(to_ist "$APPROVED")
        MERGED_IST=$(to_ist "$MERGED")

        jq -n \
        --arg publisher "$PUBLISHER" \
        --arg approver "$APPROVER" \
        --arg created "$CREATED_IST" \
        --arg approved "$APPROVED_IST" \
        --arg merged "$MERGED_IST" \
        --arg assignees "$ASSIGNEES" \
        --arg reviewers "$REVIEWERS" \
        '{
          fileMRPublisherName:$publisher,
          fileMRApprovedName:$approver,
          fileMRPublisherDateAndTime:$created,
          fileMRApprovedDateAndTime:$approved,
          fileCreationAndMergedIntoMainBranchDateAndTime:$merged,
          AssigneesNames:$assignees,
          reviewers:$reviewers
        }' > mr_fields.json

############################################
# STEP 9 — Build payload
############################################
    - name: Build payload
      if: steps.filter.outputs.continue == 'true'
      run: |
        python3 << 'EOF'
        import json, subprocess, os
        def run(cmd):
            return subprocess.getoutput(cmd).strip()
        def to_ist(date):
            if not date:
                return ""
            return run(f'date -d "{date}" +"%Y-%m-%dT%H:%M:%S"')
        with open("filtered.json") as f:
            data=json.load(f)
        with open("mr_fields.json") as f:
            mr=json.load(f)
        payload=[]
        main_commit = run('git log -1 --pretty=%s')
        main_merger = run('git log -1 --pretty=%cn')
        main_merger_email = run('git log -1 --pretty=%ce')
        for path in data["files"]:
            name=os.path.basename(path)
            ext=name.split(".")[-1]
            size=os.path.getsize(path) if os.path.exists(path) else 0
            sub_date = run(f'git log -1 --pretty=%cI -- "{path}"')
            sub_date_ist = to_ist(sub_date)
            sub_commit = run(f'git log -1 --pretty=%s -- "{path}"')
            pusher_name=run(f'git log -1 --pretty=%an -- "{path}"')
            pusher_email=run(f'git log -1 --pretty=%ae -- "{path}"')
            status=data["status"].get(path,"M")
            status_map={
                "A":"ADDED",
                "M":"MODIFIED",
                "D":"REMOVED",
                "R":"RENAMED"
            }
            obj={
                "fileName":name,
                "fileType":ext,
                "fileSize":size,
                "gitFileCreationDateAndTimeInSubBranch":sub_date_ist,
                "fileMRPublisherDateAndTime":mr["fileMRPublisherDateAndTime"],
                "fileMRApprovedDateAndTime":mr["fileMRApprovedDateAndTime"],
                "fileCreationAndMergedIntoMainBranchDateAndTime":mr["fileCreationAndMergedIntoMainBranchDateAndTime"],
                "fileModifiedInGitHubDateAndTime":sub_date_ist,
                "gitHubFileInToSubBranchPusherName":pusher_name,
                "gitHubFileInToSubBranchPusherEmailId":pusher_email,
                "fileGithubFileMergedIntoMainBranchMergerName":main_merger,
                "fileGithubFileMergedIntoMainBranchMergerEmailId":main_merger_email,
                "commitMessagesInSubBranch":sub_commit,
                "commitMessagesInMainBranch":main_commit,
                "status":status_map.get(status,status),
                "fileMRPublisherName":mr["fileMRPublisherName"],
                "fileMRApprovedName":mr["fileMRApprovedName"],
                "AssigneesNames":mr["AssigneesNames"],
                "reviewers":mr.get("reviewers")
            }
            payload.append(obj)
        with open("payload.json","w") as f:
            json.dump(payload,f,indent=2)
        print(payload)
        EOF

############################################
# STEP 10 — Send payload
############################################
    - name: Send payload
      if: steps.filter.outputs.continue == 'true'
      env:
        AGENT_USER: ${{ secrets.FILE_AGENT_USER }}
        AGENT_PASS: ${{ secrets.FILE_AGENT_PASS }}
      run: |
        # --fail-with-body: fail on HTTP errors but still print the server's response
        curl --fail-with-body -sS --max-time 120 -X POST \
        -u "$AGENT_USER:$AGENT_PASS" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -d @payload.json \
        https://funmarket-file-agent.duckdns.org/fun-market/file/information/process-file-information
